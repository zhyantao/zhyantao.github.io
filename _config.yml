baseurl:
title: Yantao's Blog
subtitle: Content-centric blogging
author: Yantao Zhang
simple_search: http://google.com/search
description: A Jekyll theme for content-rich sites
name: tufte
markdown: kramdown
kramdown:
  input: GFM # 支持 GitHub 风格 markdown：表格、删除线、任务列表、自动链接
markdown_ext: "markdown,mkdown,mkdn,mkd,md"
permalink: /articles/:short_year/:title
timezone: Asia/Shanghai
excerpt_separator: <!--more--> # you can specify your own separator, of course.
exclude:
  [
    "Gemfile",
    "Gemfile.lock",
    "Rakefile",
    "UploadToGithub.Rakefile",
    "README.md",
    "TEMPLATE.md",
  ]
post:
  template: _post.txt
  extension: md
page:
  template: _page.txt
  extension: md
editor: gvim
git:
  branch: master
