<footer>
  <hr class="slender" />
  <ul class="footer-links">
    <li>
      <a href="mailto:yantao.z@outlook.com"><span class="icon-mail3"></span></a>
    </li>
    {% for entry in site.data.social %}
    <li>
      <a href="{{ entry.link }}"><span class="{{ entry.icon }}"></span></a>
    </li>
    {% endfor %}
    <li>
      <a href="{{site.baseurl}}/resume.pdf" aria-label="Download resume PDF">
        <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
      </a>
    </li>
  </ul>
  <div class="credits">
    <span
      >&copy; {{ site.time | date: '%Y' }} &nbsp; {{site.author | upcase }}
      &nbsp; Powered by
      <a href="//github.com/clayh53/tufte-jekyll">Tufte </a> and
      <a href="//jekyllrb.com">Jekyll</a>.</span
    >
  </div>
</footer>
